<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAKSHORA | Offline Mode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: monospace;
      background: rgba(56, 189, 248, 0.1);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 1.25rem;
    }
    button {
      background: linear-gradient(135deg, #06B6D4, #3B82F6);
      color: #FFFFFF;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <div class="badge">DAKSHORA Offline Resiliency</div>
    <h1>You Are Offline</h1>
    <p>
      Internet connectivity is currently unavailable. Dakshora cached records and offline-ready features remain accessible in your browser cache.
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
