<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Golden Ring / Circular Crest -->
  <circle cx="256" cy="256" r="240" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Outer Text Ribbon Path -->
  <path id="textPathTop" d="M 68 256 A 188 188 0 0 1 444 256" fill="none" />
  <path id="textPathBottom" d="M 444 256 A 188 188 0 0 1 68 256" fill="none" />

  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="3.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      NEW IDEAL PUBLIC SCHOOL
    </textPath>
  </text>

  <text fill="#FCD34D" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ MATHURA (U.P.) • CBSE AFFILIATED ★
    </textPath>
  </text>

  <!-- Inner Shield Container -->
  <g transform="translate(0, -6)">
    <!-- Shield Border (Gold) -->
    <path d="M 256 120 
             Q 330 120 360 160 
             Q 360 260 256 340 
             Q 152 260 152 160 
             Q 182 120 256 120 Z" 
          fill="url(#goldGrad)" />

    <!-- Inner Shield (White/Navy) -->
    <path d="M 256 128 
             Q 324 128 352 164 
             Q 352 254 256 330 
             Q 160 254 160 164 
             Q 188 128 256 128 Z" 
          fill="url(#innerShield)" />

    <!-- Shield Divider / Emblem Core -->
    <!-- Torch / Flame of Wisdom -->
    <path d="M 256 150 
             Q 266 170 260 185 
             Q 275 165 270 150 
             Q 285 180 270 205 
             Q 256 220 256 220 
             Q 256 220 242 205 
             Q 227 180 242 150 
             Q 237 165 252 185 
             Q 246 170 256 150 Z" 
          fill="url(#goldGrad)" />
    <!-- Flame Core -->
    <path d="M 256 168 Q 262 182 256 198 Q 250 182 256 168 Z" fill="#EF4444" />

    <!-- Open Book of Knowledge -->
    <path d="M 205 235 
             Q 230 228 256 238 
             Q 282 228 307 235 
             L 305 268 
             Q 280 260 256 270 
             Q 232 260 207 268 Z" 
          fill="#1E3A8A" />
    <path d="M 208 238 
             Q 231 232 254 240 
             L 254 267 
             Q 231 259 210 265 Z" 
          fill="#FFFFFF" opacity="0.9" />
    <path d="M 258 240 
             Q 281 232 304 238 
             L 302 265 
             Q 281 259 258 267 Z" 
          fill="#FFFFFF" opacity="0.9" />
    <!-- Book Spine -->
    <line x1="256" y1="238" x2="256" y2="270" stroke="#F59E0B" stroke-width="2.5" />

    <!-- Letters "N" and "I" inside shield -->
    <text x="220" y="305" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" text-anchor="middle">N</text>
    <circle cx="256" cy="300" r="4" fill="#F59E0B" />
    <text x="292" y="305" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" text-anchor="middle">P</text>
  </g>

  <!-- Banner / Motto Ribbon at Bottom -->
  <g transform="translate(0, 10)">
    <path d="M 140 375 
             L 180 365 
             L 332 365 
             L 372 375 
             L 358 395 
             L 372 415 
             L 326 405 
             L 186 405 
             L 140 415 
             L 154 395 Z" 
          fill="#0F172A" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Ribbon Ends -->
    <path d="M 140 375 L 154 395 L 140 415 L 165 405 L 165 375 Z" fill="#B45309" />
    <path d="M 372 375 L 358 395 L 372 415 L 347 405 L 347 375 Z" fill="#B45309" />

    <text x="256" y="392" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="2">
      EXCELLENCE IN EDUCATION
    </text>
  </g>

  <!-- Star accents -->
  <polygon points="120,250 124,258 132,258 126,264 128,272 120,266 112,272 114,264 108,258 116,258" fill="#F59E0B" />
  <polygon points="392,250 396,258 404,258 398,264 400,272 392,266 384,272 386,264 380,258 388,258" fill="#F59E0B" />
</svg>
